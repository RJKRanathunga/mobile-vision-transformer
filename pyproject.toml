[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mvt-tracker"
version = "0.1.0"
description = "From-scratch implementation of Mobile Vision Transformer-based visual object tracking"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.14,<5",
    "Pillow>=10",
    "PyYAML>=6",
    "torch>=2.0",
]

[project.optional-dependencies]
test = [
    "easydict>=1.13",
    "pytest>=8",
    "torchvision>=0.15",
]

[tool.setuptools.packages.find]
where = ["src"]
